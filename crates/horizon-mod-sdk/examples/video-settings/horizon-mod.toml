id = "video_settings"
name = "Video Settings+"
version = "0.1.0"
description = "A Sodium-style video settings screen: one-tap presets (Potato, Balanced, Quality), every option on one page, brightness up to fullbright and the shader pack. Open it from its Settings button in Options > Mods, or /video. The Extras API native mod (extras_api.hnmod, version 3) applies the changes."
authors = ["Horizon Android"]
api = "0.1"
side = "client"
capabilities = ["command", "ui", "bridge"]
experimental = ["ui", "bridge"]
