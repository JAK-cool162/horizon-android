[mod]
id = "extras_api"
version = "3.1.0"
priority = 100

# The Extras API: an API of this native mod's own for sandboxed .hmod mods with capability
# `bridge` (docs/android-native-mods.md, "The mod bridge"). It hooks only native hook points;
# the bridge's have no hook API number yet, so `android_native_mods.py pack` pins it to the
# commit it was packed on. What it serves: runtime.rs.

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mod_extras_api"
source = "runtime.rs"

# Its row in Options > Mods, with its On/Off switch.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The API it serves.
[[injection]]
id = "apis"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_bridge_apis"
helper = "apis.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "apis", ty = "&mut Vec<(String, u32)>", value = "&mut *apis" },
]

# Mods' calls to it.
[[injection]]
id = "call"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_bridge_call"
helper = "call.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "call", ty = "&crate::game::native_hooks::NativeBridgeCall<'_>", value = "call" },
  { name = "reply", ty = "&mut Option<Result<String, String>>", value = "&mut *reply" },
]

# The values it publishes, at each server tick's end.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::ServerTickPhase", value = "phase" },
]

# Events: what happened, to the mods subscribed, with the next tick.
[[injection]]
id = "join"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_logged_in"
helper = "join.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
]

[[injection]]
id = "leave"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_logged_out"
helper = "leave.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
]

[[injection]]
id = "death"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_died"
helper = "death.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "cause", ty = "Option<&str>", value = "cause" },
]

[[injection]]
id = "killed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mob_killed"
helper = "killed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "entity", ty = "u32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
]

[[injection]]
id = "dropped"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_item_dropped"
helper = "dropped.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "item", ty = "&str", value = "item" },
  { name = "count", ty = "u32", value = "count" },
]

# Asks: the mods subscribed may cancel, at once.
[[injection]]
id = "break_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_destroy_block"
helper = "break_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "use_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "use_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "attack"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_attack_entity"
helper = "attack.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "i32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "pos", ty = "[f64; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "pickup"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_item_picked_up"
helper = "pickup.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "item", ty = "&str", value = "item" },
  { name = "count", ty = "u32", value = "count" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
  { name = "command", ty = "&str", value = "command" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
  { name = "replies", ty = "&mut Vec<horizon_client::text::Text>", value = "&mut *replies" },
]

[[injection]]
id = "explosion"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_explosion_detonate"
helper = "explosion.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "center", ty = "[f64; 3]", value = "center" },
  { name = "blocks", ty = "&mut Vec<[i32; 3]>", value = "&mut *blocks" },
]

# Its settings page: the permissions mods asked for.
[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings_click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
