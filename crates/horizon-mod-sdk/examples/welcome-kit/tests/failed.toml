# A give that fails (an unknown item, a full inventory...): the player hears why, and
# gets another try on their next join.

[bridge.extras]
values = {}
errors = { command = "Unknown item" }

[[step]]
join = "Alex"
expect.told = ["Alex: Your starter kit failed: Unknown item"]

[[step]]
leave = "Alex"

[[step]]
join = "Alex"
expect.calls = [
  "extras command give Alex minecraft:stone_pickaxe 1",
  "extras command give Alex minecraft:bread 8",
  "extras command give Alex minecraft:torch 16",
]
