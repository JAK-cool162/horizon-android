id = "appleskin"
name = "AppleSkin H"
version = "1.0.0"
description = "AppleSkin on Horizon's HUD, drawn as the original draws it: a gold outline along the drumsticks your saturation fills, the drumsticks, saturation and hearts the food in your hand would give flashing, and a checkered exhaustion bar under the hunger bar (single player). A port of squeek502's AppleSkin (Unlicense) with its own overlay art; no item tooltips yet."
authors = ["squeek502 (AppleSkin)", "Horizon Android"]
# The Horizon mod API the SDK targets.
api = "0.1"
# client: runs in the player's game.
side = "client"
# game-read: your food, saturation and health; input: the food in your hand; render: drawing
# on the hearts and the hunger bar.
capabilities = ["game-read", "input", "render"]
experimental = ["input", "render"]
