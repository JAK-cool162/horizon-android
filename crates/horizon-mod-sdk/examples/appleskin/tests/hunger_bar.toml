# AppleSkin H in the game's test harness: what it draws on the hearts and the hunger bar.

# A full bar with no saturation and 2 exhaustion: half of AppleSkin's 81-pixel checkerboard
# under the bar (40 columns × 9 rows, every other pixel), no outline.
[[step]]
player = { food = 20, saturation = 0.0, exhaustion = 2.0 }
ticks = 1
expect.hud-fills = 180
expect.hud-sprites = []

# Bread in hand (5 food, 6 saturation) at 13 food and full health: drumsticks 7 to 9 flash
# (the half 7th filled out), each over a faint empty one.
[[step]]
player = { health = 20.0, food = 13, saturation = 5.0, exhaustion = 0.0, held-food = [5, 6.0] }
ticks = 1
expect.hud-sprites = [
    "hud/food_empty", "hud/food_full",
    "hud/food_empty", "hud/food_full",
    "hud/food_empty", "hud/food_full",
]

# Sweet berries (2 food, 0.4 saturation) at 16 food and 10 health: 18 food heals 2 by natural
# regeneration before it drops to 17, so the 6th heart flashes, then the 9th drumstick.
[[step]]
player = { health = 10.0, food = 16, saturation = 0.0, held-food = [2, 0.4] }
ticks = 1
expect.hud-sprites = [
    "hud/heart/container", "hud/heart/full",
    "hud/food_empty", "hud/food_full",
]
